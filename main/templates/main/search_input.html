<div class="relative inline-block" id="search-wrapper">
    <input type="text" 
           id="search-input" 
           name="q" 
           placeholder="SEARCH" 
           value="{{ search_query|default:'' }}"
           class="pd-search-input w-48 bg-transparent border-b border-ink/30 py-2 pl-1 pr-8 text-sm tracking-[0.12em] uppercase text-ink placeholder:text-ink/40 focus:outline-none focus:border-gold transition-colors"
           hx-get="{% url 'main:catalog_all' %}" 
           hx-target="#main-content" 
           hx-push-url="true"
           hx-trigger="input delay:500ms"
           hx-swap="innerHTML">
    <button class="pd-search-clear absolute right-1 top-1/2 -translate-y-1/2 text-ink/40 hover:text-garnet transition-colors"
            aria-label="Clear search"
            hx-get="{% url 'main:catalog_all' %}?reset_search=true" 
            hx-target="#search-wrapper, #mobile-search-wrapper"
            hx-swap="innerHTML"
            hx-on::before-request="document.getElementById('search-input').value = ''; document.getElementById('search-input').placeholder = 'SEARCH';">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4">
            <path d="M1 1l10 10M11 1L1 11"/>
        </svg>
    </button>
</div>

<style>
    .pd-search-input::selection { background: var(--garnet); color: var(--gold-light); }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const searchInput = document.getElementById('search-input');
        if (searchInput) {
            searchInput.addEventListener('input', function() {
                if (this.value) {
                    this.placeholder = '';
                } else {
                    this.placeholder = 'SEARCH';
                }
            });
            searchInput.focus();
        }
    });
</script>
